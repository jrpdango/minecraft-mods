## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=amphitherefix
# The human-readable display name for the mod.
mod_name=Amphithere Fix
# The license of the mod.
mod_license=All Rights Reserved
# The mod version.
mod_version=1.1.6
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
mod_group_id=com.amphitherefix
# The authors of the mod.
mod_authors=spork
# The description of the mod.
mod_description=Quality-of-life fixes for Ice and Fire Amphitheres: after a midair dismount they\nno longer fly up into the sky and become unreachable, instead gliding down to land\nnearby; they no longer get stuck hovering frozen midair when dismounted while\ncommanded to sit; and the Amphithere's body no longer twitches sideways in flight.

# This mod uses Mixin.
use_mixin=true
