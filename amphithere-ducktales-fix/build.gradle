// Mod-specific dependencies on top of the shared config in gradle/mod-common.gradle.
dependencies {
    // Ice and Fire (the mod we are patching), deobf'd so we can reference its classes and
    // MixinGradle can generate the refmap for our mixins against it.
    compileOnly fg.deobf(files(rootProject.file('dev-libs/iceandfire-2.1.13-1.20.1-beta-5.jar')))
    // Citadel is a required dependency of Ice and Fire and is referenced by its entity hierarchy.
    compileOnly fg.deobf(files(rootProject.file('dev-libs/citadel-2.6.3-1.20.1.jar')))
}
